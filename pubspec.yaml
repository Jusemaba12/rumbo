name: rumbo
description: "Copiloto personal para buscar empleo: ofertas, HV adaptada con IA y seguimiento de postulaciones."
publish_to: 'none'
version: 0.3.8+15

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  image: ^4.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^10.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  timezone: ^0.11.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  freezed: ^4.0.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.0

flutter:
  uses-material-design: true
  generate: true
  # Tipografías del diseño (Google Fonts, licencia OFL), incluidas en la app
  # para no depender de la red.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

# Icono de la app: `dart run flutter_launcher_icons` (fuente en assets/icon,
# dibujado en SVG; los PNG se regeneran desde los .svg).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F3A32"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/foreground.png
  min_sdk_android: 26
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0F3A32"
    theme_color: "#0F3A32"
